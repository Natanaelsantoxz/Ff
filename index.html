function playAnim(url,done){
  const A=$("#anim");A.innerHTML=animSVG()+`<div id="cap"></div><div id="aact"><button class="btn s g" id="skip">Pular animação</button></div>`;A.classList.add("on");
  const cap=t=>{const c=$("#cap");if(c)c.textContent=t};
  const end=()=>{animT.forEach(clearTimeout);animT=[];$("#cap").textContent="Pedido pronto! Abra o WhatsApp para enviar";
    $("#aact").innerHTML=`<a class="btn" style="text-decoration:none;text-align:center;display:block" target="_blank" href="${url}" id="wa">Abrir WhatsApp</a><button class="btn s g" id="cl">Fechar</button>`;
    $("#cl").onclick=()=>{A.classList.remove("on");done&&done()};$("#wa").onclick=()=>setTimeout(()=>$("#cl").click(),400)};
  cap("Montando seu hambúrguer…");
  [[4000,"Embalando com carinho…"],[5600,"Pedido pronto!"]].forEach(([t,x])=>animT.push(setTimeout(()=>cap(x),t)));
  animT.push(setTimeout(()=>{end();try{window.open(url,"_blank")}catch(e){}},6400));
  $("#skip").onclick=()=>{end();window.open(url,"_blank")};
}

drawLogo();
/* ===== Área do profissional ===== */
let orders=[],seen=null;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function zapCliente(o,txt){window.open("https://wa.me/55"+o.tel.replace(/\D/g,"").replace(/^55/,"")+"?text="+encodeURIComponent(txt),"_blank")}
const AVISO={aceito:o=>`Olá, ${o.nome}! 😊\n\n✅ Seu pedido *nº ${o.num}* foi *confirmado* e já está em preparo.`,recusado:o=>`Olá, ${o.nome}.\n\nInfelizmente não conseguimos atender o pedido *nº ${o.num}* agora. Pedimos desculpas! 🙏`,pronto:o=>`Olá, ${o.nome}! 😊\n\n🍔 Seu pedido *nº ${o.num}* está *pronto*!`,entrega:o=>`Olá, ${o.nome}! 😊\n\n🛵 Seu pedido *nº ${o.num}* *saiu para entrega*!`,entregue:o=>`Pedido *nº ${o.num}* entregue. ✅\n\nObrigado pela preferência e bom apetite! 🙏`};
async function setSt(id,st){
  const o=orders.find(x=>x.id===id);
  try{const r=await api("/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:st}),headers:{Prefer:"return=minimal"}},true);if(!r.ok)throw 0}catch(e){alert("Não foi possível atualizar.");return}
  loadOrders();
  if(AVISO[st]&&confirm("Avisar o cliente pelo WhatsApp?"))zapCliente(o,AVISO[st](o));
}
const rate=()=>parseFloat((localStorage.getItem("kmrate")||"").replace(",","."))||0;
const getKm=id=>parseFloat((localStorage.getItem("km_"+id)||"").replace(",","."))||0;
function feeTxt(o){const k=getKm(o.id),r=rate();return k&&r?`🛵 ${k.toLocaleString("pt-BR")} km × ${R(r)} = <b>${R(k*r)}</b> · Total: <b>${R(o.total+k*r)}</b>`:"Informe a distância para calcular a entrega"}
function setKm(id,v){try{localStorage.setItem("km_"+id,v)}catch(e){}const o=orders.find(x=>x.id===id),el=$("#fee-"+id);if(o&&el)el.innerHTML=feeTxt(o)}
function setRate(v){try{localStorage.setItem("kmrate",v)}catch(e){}drawPanel()}
function sendFee(id){const o=orders.find(x=>x.id===id),k=getKm(id),r=rate();if(!k||!r){alert("Informe o valor por KM (no topo) e a distância do pedido.");return}
 zapCliente(o,`Olá, ${o.nome}! 😊\n\n🍔 *Pedido nº ${o.num}*\n━━━━━━━━━━━━━━\n💰 Subtotal: ${R(o.total)}\n🛵 Entrega (${k} km × ${R(r)}): ${R(k*r)}\n━━━━━━━━━━━━━━\n✅ *TOTAL: ${R(o.total+k*r)}*\n\n💳 Pagamento: ${o.pag}${o.troco?" (troco p/ R$ "+o.troco+")":""}`)}
function card(o){
  const b=(st,l,c)=>`<button class="btn s ${c||""}" onclick="setSt('${o.id}','${st}')">${l}</button>`;
  const a={novo:b("aceito","✔ Aceitar","ok")+b("recusado","✖ Recusar","no"),aceito:b("pronto","Pedido pronto"),pronto:b("entrega","Saiu para entrega"),entrega:b("entregue","Marcar entregue","ok")}[o.status]||"";
  const act=!["entregue","recusado"].includes(o.status);
  return `<div class="oc ${o.status}"><div class="row"><b>#${esc(o.num)} · ${esc(o.nome)}</b><span class="tag ${o.status}">${ST[o.status]}</span></div>
  <div class="mut">${new Date(o.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} · ${esc(o.tel)}</div>
  <div style="margin:8px 0">${o.itens.map(i=>`${i.q}× ${esc(i.n)}`).join("<br>")}</div>
  <div>📍 ${esc(o.end)}${o.ref?" – "+esc(o.ref):""}</div>
  <div>💳 ${esc(o.pag)}${o.troco?" (troco p/ R$ "+esc(o.troco)+")":""} · Subtotal <b>${R(o.total)}</b></div>${o.obs?`<div>📝 ${esc(o.obs)}</div>`:""}
  ${act?`<div class="kmrow"><input class="kmi" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Distância até o cliente (km)" value="${getKm(o.id)||""}" oninput="setKm('${o.id}',this.value)"><div class="mut" id="fee-${o.id}" style="margin-top:6px">${feeTxt(o)}</div></div>`:""}
  <div class="acts">${a}${act?`<button class="btn s g" onclick="sendFee('${o.id}')">💬 Enviar total</button>`:""}<button class="btn s g" onclick="zapCliente(orders.find(x=>x.id==='${o.id}'),'Olá, ${esc(o.nome)}! Sobre seu pedido nº ${esc(o.num)}:')">WhatsApp</button></div></div>`;
}
function drawPanel(){
  const act=orders.filter(o=>!["entregue","recusado"].includes(o.status)),done=orders.filter(o=>["entregue","recusado"].includes(o.status));
  $("#panel").innerHTML=`<header><div class="logo">Painel do Profissional</div><div class="sub">Pedidos em tempo real · <a style="color:var(--ac)" href="#" onclick="logout();return false">Sair</a> · <a style="color:var(--ac)" href="#" onclick="location.hash='';return false">Voltar ao cardápio</a></div></header>
  <div class="oc"><label style="margin-top:0">Valor por KM da entrega (R$)</label><input class="kmi" type="number" inputmode="decimal" step="0.5" min="0" placeholder="Ex.: 2" value="${rate()||""}" onchange="setRate(this.value)"></div>
  <h2>Em andamento (${act.length})</h2>${act.map(card).join("")||'<div class="mut">Nenhum pedido no momento.</div>'}
  <h2>Finalizados</h2>${done.slice(0,15).map(card).join("")||'<div class="mut">—</div>'}`;
}
const API=SUPABASE_URL+"/rest/v1",AUTH=SUPABASE_URL+"/auth/v1";
const cfgOk=()=>!SUPABASE_URL.startsWith("COLE");
let tok=null;try{tok=JSON.parse(localStorage.getItem("sbtok")||"null")}catch(e){}
function setTok(t){tok=t;try{t?localStorage.setItem("sbtok",JSON.stringify(t)):localStorage.removeItem("sbtok")}catch(e){}}
async function refresh(){try{const r=await fetch(AUTH+"/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:tok.refresh_token})});if(!r.ok){setTok(null);return false}setTok(await r.json());return true}catch(e){return false}}
async function api(path,opt,auth){
  opt=opt||{};const h=Object.assign({apikey:SUPABASE_KEY,"Content-Type":"application/json"},opt.headers||{});
  if(auth&&tok)h.Authorization="Bearer "+tok.access_token;
  let r=await fetch(API+path,Object.assign({},opt,{headers:h}));
  if(r.status===401&&auth&&tok&&await refresh()){h.Authorization="Bearer "+tok.access_token;r=await fetch(API+path,Object.assign({},opt,{headers:h}))}
  return r;
}
async function startPanel(){
  $("#panel").innerHTML='<header><div class="logo">Carregando…</div></header>';
  try{await Promise.race([startPanel0(),new Promise((_,r)=>setTimeout(()=>r(new Error("a conexão demorou demais")),15000))])}
  catch(e){$("#panel").innerHTML='<header><div class="logo">Erro ao abrir</div><div class="sub">'+esc(e&&e.message||e)+'<br><br><a style="color:var(--ac)" href="#" onclick="startPanel();return false">Tentar de novo</a> · <a style="color:var(--ac)" href="#" onclick="location.hash=\'\';return false">Voltar</a></div></header>'}
}
async function startPanel0(){
  const P=$("#panel");
  if(!cfgOk()){P.innerHTML=`<header><div class="logo">Painel</div><div class="sub">Configure SUPABASE_URL e SUPABASE_KEY no início do index.html.</div></header>`;return}
  if(!tok){
    P.innerHTML=`<header><div class="logo">Área do profissional</div></header><div class="oc"><label>Senha</label><input id="lg-s" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div id="lg-err" style="color:var(--bad);margin-top:8px"></div><div class="acts"><button class="btn" onclick="login()">Entrar</button></div><p class="mut"><a style="color:var(--ac)" href="#" onclick="location.hash='';return false">Voltar ao cardápio</a></p></div>`;return}
  await loadOrders();
  if(!poll)poll=setInterval(()=>{if(location.hash==="#painel"&&tok)loadOrders()},6000);
}
async function login(){
  const err=$("#lg-err");err.textContent="Entrando…";
  try{const ac=new AbortController();setTimeout(()=>ac.abort(),15000);const r=await fetch(AUTH+"/token?grant_type=password",{signal:ac.signal,method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:PRO_EMAIL,password:$("#lg-s").value})});
    if(!r.ok){let m="";try{m=(await r.json()).error_description||""}catch(e){}err.textContent=r.status===400?"Senha incorreta"+(m&&!/invalid login/i.test(m)?" ("+m+")":"")+".":"Erro ao entrar ("+r.status+").";return}
    setTok(await r.json());startPanel()}catch(e){err.textContent=e&&e.name==="AbortError"?"A conexão demorou demais. Tente de novo.":"Sem conexão. Tente de novo."}
}
function logout(){setTok(null);startPanel()}
async function loadOrders(){
  const r=await api("/orders?select=*&order=ts.desc&limit=80",{},true);
  if(r.status===401){setTok(null);startPanel();return}
  if(!r.ok){let m="";try{m=await r.text()}catch(e){}
    if(!orders.length){$("#panel").innerHTML='<header><div class="logo">Não foi possível carregar os pedidos</div><div class="sub">Erro '+r.status+'<br><span style="word-break:break-all">'+esc(m.slice(0,300))+'</span><br><br><a style="color:var(--ac)" href="#" onclick="startPanel();return false">Tentar de novo</a> · <a style="color:var(--ac)" href="#" onclick="logout();return false">Sair</a></div></header>'}
    return}
  let data=await r.json();
  if(!Array.isArray(data))data=[];
  data.forEach(x=>{if(typeof x.itens==="string"){try{x.itens=JSON.parse(x.itens)}catch(e){x.itens=[]}}if(!Array.isArray(x.itens))x.itens=[];x.total=Number(x.total)||0;x.num=x.num||"";x.nome=x.nome||"";x.tel=x.tel||"";x.endereco=x.endereco||"";x.pag=x.pag||""});
  if(document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains("kmi")){setTimeout(loadOrders,4000);return}
  orders=data.map(x=>Object.assign({},x,{end:x.endereco}));
  const nov=orders.filter(o=>o.status==="novo").length;
  if(seen!==null&&nov>seen)beep();seen=nov;drawPanel();
}
function trk(id){let n=0;const t=setInterval(async()=>{n++;const el=$("#trk");if(!cfgOk()||!el||n>200){clearInterval(t);return}try{const r=await api("/rpc/order_status",{method:"POST",body:JSON.stringify({oid:id})});const d=await r.json();if(typeof d==="string"&&ST[d])el.innerHTML="Status: <span class='tag "+d+"'>"+ST[d]+"</span>"}catch(e){}},6000)}
function route(){
  const p=location.hash==="#painel";
  $("#app").style.display=p?"none":"block";$("#panel").style.display=p?"block":"none";
  if(p)startPanel();
}
addEventListener("hashchange",route);
drawMenu();upd();route();
</script></body></html>
