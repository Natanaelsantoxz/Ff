<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lolly Lanches – Cardápio Online</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e0e0f;--card:#1a1a1c;--line:#2d2d31;--tx:#f5f5f5;--mut:#a3a3ab;--ac:#ffb400;--on:#111;--ok:#2ecc71;--bad:#ff5a5a;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4ef;--card:#fff;--line:#e3dfd4;--tx:#1b1b1d;--mut:#6b6b73;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0e0e0f}
html{scroll-padding-top:60px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:28px 0 14px;text-align:center}
.logo{font:900 34px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:1px;color:var(--ac);text-transform:uppercase}
.sub{color:var(--mut);margin-top:6px;font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:10px 16px;display:flex;gap:8px}
nav a{color:var(--tx);text-decoration:none;border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px}
nav a:active{background:var(--ac);color:var(--on)}
h2{font:900 26px Impact,"Arial Narrow",sans-serif;color:var(--ac);text-transform:uppercase;margin:28px 0 12px;letter-spacing:.5px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.item b{display:block;font-size:16px;text-transform:uppercase}
.item small{color:var(--mut);display:block;margin-top:3px}
.pr{color:var(--ac);font-weight:800;margin-top:6px;display:block}
.q{display:flex;align-items:center;gap:10px;flex-shrink:0}
.q button,.btn{border:0;border-radius:10px;font-weight:800;cursor:pointer;font-size:15px}
.q button{width:34px;height:34px;background:var(--ac);color:var(--on)}
.q button.m{background:var(--line);color:var(--tx)}
.q span{min-width:16px;text-align:center;font-weight:700}
.btn{background:var(--ac);color:var(--on);padding:13px 18px;width:100%}
.btn.s{width:auto;padding:9px 13px;font-size:13px}
.btn.g{background:var(--line);color:var(--tx)}
.btn.ok{background:var(--ok);color:#06210f}
.btn.no{background:var(--bad);color:#2a0606}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
#bar .btn{display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:0 auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:600;text-transform:uppercase}
input,select,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
.row{display:flex;justify-content:space-between;padding:5px 0}
.tot{font-size:19px;font-weight:800;color:var(--ac);border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.oc.novo{border-color:var(--ac);box-shadow:0 0 0 2px rgba(255,180,0,.25)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;background:var(--line)}
.tag.novo{background:var(--ac);color:var(--on)}.tag.aceito,.tag.pronto,.tag.entrega{background:#3b82f6;color:#fff}.tag.entregue{background:var(--ok);color:#06210f}.tag.recusado{background:var(--bad);color:#2a0606}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mut{color:var(--mut);font-size:13px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:30px 0}
footer a{color:var(--mut)}
#anim{position:fixed;inset:0;z-index:100;background:#0e0e0f;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff}
#anim.on{display:flex}
#anim svg{width:min(94vw,440px);height:auto;max-height:68vh}
#cap{font:800 20px Impact,"Arial Narrow",sans-serif;letter-spacing:.5px;color:#ffb400;margin:14px 0 8px;text-align:center;text-transform:uppercase;min-height:26px}
#aact{display:flex;gap:10px;min-height:48px;align-items:center}
/* animação do pedido */
.glow{transform-box:fill-box;transform-origin:center;animation:glwp 2.4s ease-in-out infinite}
@keyframes glwp{50%{transform:scale(1.1);opacity:.7}}
.bagwrap{transform-origin:180px 398px;animation:bagin .6s .05s cubic-bezier(.2,1.3,.4,1) both,bagj .65s 5.35s ease-in-out}
@keyframes bagin{from{transform:translateY(80px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes bagj{30%{transform:translateY(-20px) scaleY(1.05)}55%{transform:translateY(0) scaleY(.93)}75%{transform:translateY(-6px)}100%{transform:none}}
.dl{transform-box:fill-box;transform-origin:50% 100%;animation:ldrop .62s cubic-bezier(.25,.9,.35,1) var(--d) both}
@keyframes ldrop{0%{transform:translateY(-330px);opacity:0}12%{opacity:1}68%{transform:translateY(0) scale(1.05,.9)}84%{transform:translateY(-5px) scale(.98,1.04)}100%{transform:none;opacity:1}}
#bgr{transform-origin:180px 235px;animation:bgw .5s 3.5s ease-in-out,bgi .95s 4.05s cubic-bezier(.55,0,.85,.35) forwards}
@keyframes bgw{25%{transform:rotate(-2.5deg) scale(1.03)}75%{transform:rotate(2.5deg) scale(1.03)}}
@keyframes bgi{to{transform:translateY(150px) scale(.55)}}
.flap{transform-origin:180px 230px;animation:flp .35s 4.85s ease-out both}
@keyframes flp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chk{transform-box:fill-box;transform-origin:center;animation:ckp .5s 5.5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes ckp{from{transform:scale(0)}to{transform:scale(1)}}
.sp{transform-box:fill-box;transform-origin:center;animation:spk 1.1s var(--d) ease-out both}
@keyframes spk{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.3) rotate(45deg)}100%{transform:scale(0) rotate(90deg)}}
.cf{animation:conf 1s 5.5s cubic-bezier(.15,.7,.35,1) both}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(0);opacity:1}15%{transform:translate(calc(var(--x)*.2),calc(var(--y)*.2)) rotate(40deg) scale(1);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 70px)) rotate(var(--r)) scale(1);opacity:0}}
#logoH{width:150px;height:150px;margin:0 auto 10px;cursor:pointer;border-radius:50%;box-shadow:0 0 0 3px var(--ac),0 8px 30px rgba(255,180,0,.25)}
#logoH svg{width:100%;height:100%;display:block}
.lga .lgring{stroke-dasharray:592;stroke-dashoffset:592;animation:lgdraw 1.4s ease-out forwards}
@keyframes lgdraw{to{stroke-dashoffset:0}}
.lga .lgl{opacity:0;animation:lgdrop .55s ease-out both}
@keyframes lgdrop{0%{transform:translateY(-45px);opacity:0}65%{transform:translateY(4px);opacity:1}100%{transform:none;opacity:1}}
.lga .lgfl{animation:lgfloat 2.8s ease-in-out 2s infinite}
@keyframes lgfloat{50%{transform:translateY(-4px)}}
.lga .lgtx{animation:lgfade .9s .4s both}
@keyframes lgfade{from{opacity:0}to{opacity:1}}
.lga .lgsp{transform-box:fill-box;transform-origin:center;animation:lgtw 1.8s ease-in-out 1.6s infinite}
@keyframes lgtw{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1.3);opacity:1}}
.lga .lgph{transform-box:fill-box;transform-origin:center;animation:lgfade .9s 1.2s both,lgpulse 2.4s ease-in-out 2.2s infinite}
@keyframes lgpulse{50%{transform:scale(1.07)}}
.fly{position:fixed;left:0;top:0;z-index:40;pointer-events:none;width:30px;height:30px}
#bagi{width:46px;height:42px;display:block;flex-shrink:0}
#bagi.bump{animation:bump .45s ease-out}
@keyframes bump{35%{transform:scale(1.3) rotate(-8deg)}70%{transform:scale(.95) rotate(4deg)}100%{transform:none}}
.bl{display:flex;align-items:center;gap:12px}
.kmrow{margin-top:10px}
/* ===== Painel do profissional ===== */
#panel.wrap{max-width:1000px;padding-bottom:110px}
#panel header{padding:40px 0 18px}
#panel header .logo{font:700 20px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);text-transform:none;letter-spacing:0}
#panel h2{font:700 12px system-ui,-apple-system,sans-serif;letter-spacing:.09em;color:var(--mut);margin:26px 0 10px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
#panel .cnt{background:var(--line);color:var(--tx);border-radius:99px;padding:1px 9px;font-size:11px}
#panel .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
#panel .bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
#panel .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;line-height:1.2}
#panel .dot{width:38px;height:38px;border-radius:11px;background:var(--ac);display:grid;place-items:center;font-size:20px}
#panel .links a{color:var(--mut);font-size:13px;text-decoration:none;margin-left:14px;font-weight:600}
#panel .seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:12px}
#panel .seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 6px;border-radius:9px;font:600 13px system-ui,-apple-system,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
#panel .seg button.on{background:var(--ac);color:var(--on)}
#panel .bdg{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
#panel .oc{border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:none}
#panel .oc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
#panel .oc.st-novo{border-color:var(--ac)}#panel .oc.st-novo::before{background:var(--ac)}
#panel .oc.st-aceito::before,#panel .oc.st-pronto::before,#panel .oc.st-entrega::before{background:#3b82f6}
#panel .oc.st-entregue::before{background:var(--ok)}#panel .oc.st-recusado::before{background:var(--bad)}
#panel .oc.rt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#panel .oc.rt::before{background:var(--ac)}
#panel .rin{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:600}
#panel .rin input{width:96px;text-align:right}
#panel .pgrid{display:grid;gap:12px}
#panel .pgrid .oc{margin:0}
@media(min-width:860px){#panel .pgrid{grid-template-columns:1fr 1fr;align-items:start}}
#panel .oh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#panel .on{font-weight:700;font-size:16px}
#panel .lis{margin:12px 0 4px;border-top:1px solid var(--line)}
#panel .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
#panel .li .qt{font-weight:800;min-width:26px;color:var(--ac)}
#panel .li .nm{flex:1}
#panel .li .pc{color:var(--mut);font-variant-numeric:tabular-nums}
#panel .li .st{display:flex;gap:6px}
#panel .li .st button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--tx);font-size:16px;font-weight:700;cursor:pointer}
#panel .dt{margin:10px 0 2px}
#panel .dt summary{cursor:pointer;color:var(--ac);font-weight:700;font-size:13px;padding:4px 0}
#panel .dt select{margin-top:8px}
#panel .info{margin-top:10px;display:grid;gap:4px;font-size:14px}
#panel .sum{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
#panel .sr{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums;color:var(--mut)}
#panel .sr b{color:var(--tx)}
#panel .sr.t{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-size:17px;color:var(--tx)}
#panel .sr.t b{color:var(--ac)}
#panel .btn{border-radius:10px}
#panel .btn.out{background:transparent;border:1px solid var(--line);color:var(--tx)}
#panel .empty{grid-column:1/-1;text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:16px;color:var(--tx)}
#panel .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:760px){#panel .kpis{grid-template-columns:repeat(4,1fr)}}
#panel .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
#panel .kpi.hero{grid-column:1/-1;border-color:var(--ac)}
#panel .kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700;letter-spacing:.06em}
#panel .kpi .v{font-size:26px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
#panel .kpi.hero .v{font-size:34px;color:var(--ac)}
#panel .bars{display:flex;align-items:flex-end;gap:8px;height:170px}
#panel .bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
#panel .bc i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 0 0}
#panel .bv{font-size:10px;color:var(--mut)}
#panel .bl2{font-size:11px;color:var(--mut);text-transform:capitalize;white-space:nowrap}
#panel .rk{margin-bottom:12px}
#panel .rk .row{padding:0 0 5px}
#panel .pb{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
#panel .pb i{display:block;height:100%;background:var(--ac);border-radius:9px}
#panel .eit{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
#panel .g2{display:grid;grid-template-columns:1fr 110px;gap:10px}
#panel .savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:18px}
#panel .savebar .btn{box-shadow:0 6px 24px rgba(0,0,0,.35)}
#panel .login{max-width:380px;margin:0 auto;text-align:center;padding-top:48px}
#panel .login .dot{width:64px;height:64px;font-size:32px;margin:0 auto 14px;border-radius:18px}
#panel .login h1{font:800 22px system-ui,-apple-system,sans-serif;margin:0}
#panel .login .oc{text-align:left;margin-top:22px}

/* ===== Visual premium: profissional + motoboy ===== */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#panel{--r:18px;--sh:0 1px 2px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.18);--blue:#3b82f6}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #panel{--sh:0 1px 2px rgba(30,25,10,.06),0 8px 24px rgba(30,25,10,.08)}}
#panel{background:radial-gradient(900px 380px at 50% -120px,rgba(255,180,0,.10),transparent 70%)}
#panel .bar{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:14px 0 14px;margin-bottom:20px}
#panel .brand .dot{background:linear-gradient(135deg,#ffcf3d,#ff9d00);box-shadow:0 6px 16px rgba(255,160,0,.35);border-radius:13px}
#panel .brand{letter-spacing:-.01em}
#panel .links a{display:inline-flex;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--tx);font-size:12.5px;margin-left:8px;transition:.15s}
#panel .links a:active{transform:scale(.96)}
#panel .seg{padding:5px;border-radius:14px;background:var(--card);box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
#panel .seg button{padding:10px 8px;border-radius:10px;transition:.18s;font-weight:700}
#panel .seg button.on{background:linear-gradient(135deg,#ffc933,#ffab00);color:#1a1200;box-shadow:0 4px 12px rgba(255,170,0,.35)}
#panel .bdg{box-shadow:0 0 0 2px var(--card);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
#panel h2{margin:30px 2px 12px;font-size:11.5px;letter-spacing:.12em}
#panel h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
#panel .cnt{background:var(--card);border:1px solid var(--line);color:var(--ac);font-weight:800}
#panel .oc{border-radius:var(--r);box-shadow:var(--sh);padding:18px 18px 18px 20px;animation:rise .35s ease both;transition:transform .15s,border-color .15s}
#panel .oc::before{width:5px}
#panel .oc.st-novo{background:linear-gradient(180deg,rgba(255,180,0,.09),transparent 140px),var(--card);box-shadow:0 0 0 1px var(--ac),0 10px 30px rgba(255,180,0,.14)}
#panel .on{letter-spacing:-.01em;font-size:16.5px}
#panel .tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;font-size:10.5px;letter-spacing:.06em;white-space:nowrap}
#panel .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
#panel .tag.novo::before{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
#panel .lis{border-top:1px dashed var(--line);margin-top:14px}
#panel .li{border-bottom:1px dashed var(--line);padding:10px 0}
#panel .li .qt{background:rgba(255,180,0,.14);color:var(--ac);border-radius:8px;padding:3px 0;text-align:center;font-size:13px}
#panel .li .st button{border-radius:9px;background:var(--bg);transition:.12s}
#panel .li .st button:active{background:var(--ac);color:var(--on);transform:scale(.92)}
#panel .info{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;gap:6px;margin-top:14px;line-height:1.35}
#panel .sum{background:linear-gradient(180deg,var(--bg),transparent),var(--bg);border-radius:14px;padding:10px 14px}
#panel .sr.t{font-size:18px}
#panel .btn{font-weight:800;letter-spacing:.01em;transition:transform .12s,filter .15s,box-shadow .15s}
#panel .btn:active{transform:scale(.97)}
#panel .btn:hover{filter:brightness(1.06)}
#panel .btn.ok{background:linear-gradient(135deg,#34d67b,#22b862);color:#04200f;box-shadow:0 6px 16px rgba(46,204,113,.28)}
#panel .btn.no{background:transparent;border:1px solid var(--bad);color:var(--bad)}
#panel .btn.out{background:var(--card);border:1px solid var(--line)}
#panel .btn.s{padding:11px 15px;border-radius:11px}
#panel .acts .btn.ok{flex:1}
#panel input,#panel select,#panel textarea{border-radius:11px;transition:border-color .15s,box-shadow .15s}
#panel input:focus,#panel select:focus,#panel textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,180,0,.2)}
#panel .dt summary{list-style:none;display:inline-flex;align-items:center;background:rgba(255,180,0,.1);border-radius:9px;padding:7px 11px}
#panel .dt summary::-webkit-details-marker{display:none}
#panel .kpi{border-radius:var(--r);box-shadow:var(--sh);padding:16px;animation:rise .4s ease both;position:relative;overflow:hidden}
#panel .kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:rgba(255,180,0,.07)}
#panel .kpi.hero{background:linear-gradient(135deg,rgba(255,180,0,.20),rgba(255,180,0,.04)),var(--card);border-color:rgba(255,180,0,.55)}
#panel .kpi.hero .v{font-size:38px;letter-spacing:-.02em}
#panel .bars{height:190px;padding-top:6px}
#panel .bc i{background:linear-gradient(180deg,#ffc933,#ff9d00);border-radius:8px 8px 3px 3px;box-shadow:0 4px 12px rgba(255,160,0,.25);transition:height .5s}
#panel .pb{height:9px}#panel .pb i{background:linear-gradient(90deg,#ff9d00,#ffc933)}
#panel .empty{border-radius:var(--r);padding:34px 14px;background:var(--card);border-style:dashed}
#panel .empty::before{content:"🍔";display:block;font-size:34px;margin-bottom:8px;filter:grayscale(.3)}
#panel .oc.rt{background:linear-gradient(135deg,rgba(255,180,0,.10),transparent),var(--card)}
#panel .savebar .btn{padding:16px;font-size:16px;border-radius:14px}
#panel .login .dot{background:linear-gradient(135deg,#ffcf3d,#ff9d00);box-shadow:0 12px 30px rgba(255,160,0,.35)}
#panel .login .oc{padding:22px}

async function geocode(q){
  try{const ac=new AbortController();setTimeout(()=>ac.abort(),9000);
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&viewbox=-47.90,-22.50,-47.40,-22.95&q="+encodeURIComponent(q),{signal:ac.signal});
    if(!r.ok)throw new Error("geo"+r.status);const d=await r.json();return d&&d[0]?{lat:+d[0].lat,lon:+d[0].lon}:null
  }catch(e){
    const ac=new AbortController();setTimeout(()=>ac.abort(),9000);
    const r=await fetch("https://photon.komoot.io/api/?limit=1&lat=-22.7254&lon=-47.6488&q="+encodeURIComponent(q),{signal:ac.signal});
    if(!r.ok)throw new Error("geo"+r.status);const d=await r.json();const f=d&&d.features&&d.features[0];
    return f?{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}:null
  }}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function geoFind(end,ref){
  const semNum=end.replace(/[,\s-]*(n[º°o.]?\s*)?\d+[a-zA-Z]?\s*$/i,"").trim();
  const c=[];
  if(ref)c.push(end+", "+ref+", Piracicaba, SP");
  c.push(end+", Piracicaba, SP");
  if(semNum&&semNum!==end){if(ref)c.push(semNum+", "+ref+", Piracicaba, SP");c.push(semNum+", Piracicaba, SP")}
  if(ref)c.push(ref+", Piracicaba, SP");
  const seen={};let first=true;
  for(const q of c){if(seen[q])continue;seen[q]=1;if(!first)await sleep(1100);first=false;
    const p=await geocode(q);if(p)return p}
  return null}
function hav(a,b){const t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon),h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
async function roadKm(p){try{const ac=new AbortController();setTimeout(()=>ac.abort(),8000);const r=await fetch("https://router.project-osrm.org/route/v1/driving/"+ORIG.lon+","+ORIG.lat+";"+p.lon+","+p.lat+"?overview=false",{signal:ac.signal});if(r.ok){const d=await r.json();if(d.routes&&d.routes[0])return d.routes[0].distance/1000}}catch(e){}return hav(ORIG,p)*1.3}

async function calcEntrega(){

  const key=addrKey(),my=++entBusy;setBtnCalc(true);$("#ent-m").textContent="Calculando entrega…";$("#ent-v").textContent="…";
  try{
    const p=await geoFind(end,bai==="Outro"?"":bai);

    if(!p){ENT={key,ok:false,msg:"Não encontramos esse endereço. Confira a rua e o número e toque em Calcular entrega de novo."};return}

  }catch(e){if(my!==entBusy)return;ENT={key,ok:false,msg:"Sem conexão para calcular ("+(e&&e.message||"erro")+"). Toque em Calcular entrega de novo."}}
  finally{if(my===entBusy){setBtnCalc(false);showEnt()}}
}

  <div class="kpis">

   <div class="kpi"><div class="l">Pedidos entregues</div><div class="v">${ok.length}</div><div class="mut">${ok.filter(isRet).length} retirada(s) · ${rej.length} recusado(s)</div></div>

  <div class="pgrid"><div><h2>Forma de pagamento</h2><div class="oc">${pays.map(([k,v])=>`<div class="rk"><div class="row"><span>${esc(k)}</span><b>${BRL(v)}</b></div><div class="pb"><i style="width:${rev?Math.round(v/rev*100):0}%"></i></div></div>`).join("")||'<div class="mut">Sem vendas no período.</div>'}</div></div>

  <div class="acts"><button class="btn s out" onclick="FIN=null;loadFin();drawPanel()">↻ Atualizar</button></div>

}

const API=SUPABASE_URL+"/rest/v1",AUTH=SUPABASE_URL+"/auth/v1";
const cfgOk=()=>!SUPABASE_URL.startsWith("COLE");
let tok=null;try{tok=JSON.parse(localStorage.getItem("sbtok")||"null")}catch(e){}
function setTok(t){tok=t;try{t?localStorage.setItem("sbtok",JSON.stringify(t)):localStorage.removeItem("sbtok")}catch(e){}}
async function refresh(){try{const r=await fetch(AUTH+"/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:tok.refresh_token})});if(!r.ok){setTok(null);return false}setTok(await r.json());return true}catch(e){return false}}
async function api(path,opt,auth){
  opt=opt||{};const h=Object.assign({apikey:SUPABASE_KEY,"Content-Type":"application/json"},opt.headers||{});
  if(auth&&tok)h.Authorization="Bearer "+tok.access_token;
  let r=await fetch(API+path,Object.assign({},opt,{headers:h}));
  if(r.status===401&&auth&&tok&&await refresh()){h.Authorization="Bearer "+tok.access_token;r=await fetch(API+path,Object.assign({},opt,{headers:h}))}
  return r;
}

  $("#panel").innerHTML='<header><div class="logo">Carregando…</div></header>';
  try{await Promise.race([startPanel0(),new Promise((_,r)=>setTimeout(()=>r(new Error("a conexão demorou demais")),15000))])}
  catch(e){$("#panel").innerHTML='<header><div class="logo">Erro ao abrir</div><div class="sub">'+esc(e&&e.message||e)+'<br><br><a style="color:var(--ac)" href="#" onclick="startPanel();return false">Tentar de novo</a> · <a style="color:var(--ac)" href="#" onclick="location.hash=\'\';return false">Voltar</a></div></header>'}
}
async function startPanel0(){
  const P=$("#panel");
  if(!cfgOk()){P.innerHTML=`<header><div class="logo">Painel</div><div class="sub">Configure SUPABASE_URL e SUPABASE_KEY no início do index.html.</div></header>`;return}
  if(!tok){
    P.innerHTML=`<div class="login"><div class="dot">🍔</div><h1>Lolly Lanches</h1><div class="mut">Área do profissional</div><div class="oc"><label style="margin-top:0">Senha</label><input id="lg-s" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div id="lg-err" style="color:var(--bad);margin-top:8px;min-height:18px"></div><div class="acts"><button class="btn" style="width:100%" onclick="login()">Entrar</button></div></div><p class="mut"><a style="color:var(--ac)" href="#" onclick="location.hash='';return false">Voltar ao cardápio</a></p></div>`;return}
  await loadOrders();
  if(!poll)poll=setInterval(()=>{if(location.hash==="#painel"&&tok)loadOrders()},6000);
}
async function login(){
  const err=$("#lg-err");err.textContent="Entrando…";
  try{const ac=new AbortController();setTimeout(()=>ac.abort(),15000);const r=await fetch(AUTH+"/token?grant_type=password",{signal:ac.signal,method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:PRO_EMAIL,password:$("#lg-s").value})});
    if(!r.ok){let m="";try{m=(await r.json()).error_description||""}catch(e){}err.textContent=r.status===400?"Senha incorreta"+(m&&!/invalid login/i.test(m)?" ("+m+")":"")+".":"Erro ao entrar ("+r.status+").";return}
    setTok(await r.json());location.hash==='#motoboy'?startMoto():startPanel()}catch(e){err.textContent=e&&e.name==="AbortError"?"A conexão demorou demais. Tente de novo.":"Sem conexão. Tente de novo."}
}
function logout(){setTok(null);ptab="ped";location.hash==="#motoboy"?startMoto():startPanel()}
async function loadOrders(force){
  const r=await api("/orders?select=*&order=ts.desc&limit=80",{},true);
  if(r.status===401){setTok(null);startPanel();return}
  if(!r.ok){let m="";try{m=await r.text()}catch(e){}
    if(!orders.length){$("#panel").innerHTML='<header><div class="logo">Não foi possível carregar os pedidos</div><div class="sub">Erro '+r.status+'<br><span style="word-break:break-all">'+esc(m.slice(0,300))+'</span><br><br><a style="color:var(--ac)" href="#" onclick="startPanel();return false">Tentar de novo</a> · <a style="color:var(--ac)" href="#" onclick="logout();return false">Sair</a></div></header>'}
    return}
  let data=await r.json();
  if(!Array.isArray(data))data=[];
  data.forEach(x=>{if(typeof x.itens==="string"){try{x.itens=JSON.parse(x.itens)}catch(e){x.itens=[]}}if(!Array.isArray(x.itens))x.itens=[];x.total=Number(x.total)||0;x.num=x.num||"";x.nome=x.nome||"";x.tel=x.tel||"";x.endereco=x.endereco||"";x.pag=x.pag||""});
  const ae=document.activeElement;if(!force&&((ae&&(ae.tagName==="INPUT"||ae.tagName==="SELECT"))||document.querySelector("#panel details[open]"))){return}
  orders=data.map(x=>Object.assign({},x,{end:x.endereco}));
  const nov=orders.filter(o=>o.status==="novo").length;
  if(seen!==null&&nov>seen)beep();seen=nov;if(ptab==='ped')drawPanel();
}

/* ===== Área do motoboy ===== */
let MORD=[],mseen=null,mpoll=null;
const mapsUrl=o=>{const bai=String(o.ref||"").split(" - ")[0];return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([o.end,bai,"Piracicaba, SP"].filter(Boolean).join(", "))};
async function startMoto(){
  const P=$("#panel");
  if(!cfgOk()){P.innerHTML='<header><div class="logo">Motoboy</div><div class="sub">Configure o Supabase.</div></header>';return}
  if(!tok){
    P.innerHTML=`<div class="login"><div class="dot">🛵</div><h1>Lolly Lanches</h1><div class="mut">Área do motoboy</div><div class="oc"><label style="margin-top:0">Senha</label><input id="lg-s" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div id="lg-err" style="color:var(--bad);margin-top:8px;min-height:18px"></div><div class="acts"><button class="btn" style="width:100%" onclick="login()">Entrar</button></div></div><p class="mut"><a style="color:var(--ac)" href="#" onclick="location.hash='';return false">Voltar ao cardápio</a></p></div>`;return}
  P.innerHTML='<header><div class="logo">Carregando…</div></header>';
  await loadMoto(true);
  if(!mpoll)mpoll=setInterval(()=>{if(location.hash==="#motoboy"&&tok)loadMoto()},6000);
}
async function loadMoto(force){
  try{
    const r=await api("/orders?select=*&status=in.(pronto,entrega)&order=ts.asc&limit=60",{},true);
    if(r.status===401){setTok(null);startMoto();return}
    if(!r.ok){if(!MORD.length&&force)$("#panel").innerHTML='<header><div class="logo">Não foi possível carregar</div><div class="sub">Erro '+r.status+'<br><a style="color:var(--ac)" href="#" onclick="startMoto();return false">Tentar de novo</a></div></header>';return}
    let d=await r.json();if(!Array.isArray(d))d=[];
    d.forEach(x=>{if(typeof x.itens==="string"){try{x.itens=JSON.parse(x.itens)}catch(e){x.itens=[]}}if(!Array.isArray(x.itens))x.itens=[];x.total=Number(x.total)||0;x.num=x.num||"";x.nome=x.nome||"";x.tel=x.tel||"";x.pag=x.pag||"";x.end=x.endereco||"";x.ref=x.ref||""});
    MORD=d.filter(o=>!isRet(o));
    const n=MORD.filter(o=>o.status==="pronto").length;
    if(mseen!==null&&n>mseen)beep();mseen=n;
    drawMoto();
  }catch(e){if(force&&!MORD.length)$("#panel").innerHTML='<header><div class="logo">Sem conexão</div><div class="sub"><a style="color:var(--ac)" href="#" onclick="startMoto();return false">Tentar de novo</a></div></header>'}
}
function motoCard(o){
  const f=Number(o.entrega)||0,tot=o.total+f,en=o.status==="entrega";
  const parts=String(o.ref||"").split(" - "),bai=parts[0],cpl=parts.slice(1).join(" - ");
  const hora=o.ts?new Date(o.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
  const itens=o.itens.map(i=>`<b>${i.q}×</b> ${esc(i.n)}`).join(" &nbsp;·&nbsp; ");
  const tel=String(o.tel).replace(/\D/g,"");
  const act=en
    ?`<button class="btn ok mgo" onclick="motoChegou('${o.id}')">✔ Pedido chegou</button>`
    :`<button class="btn mgo go" onclick="motoSaiu('${o.id}')">🛵 Saiu para entregar</button>`;
  return `<div class="oc mt st-${o.status}"><div class="oh"><div><div class="on">#${esc(o.num)} · ${esc(o.nome)}</div><div class="mut">${hora?"Pedido às "+hora+" · ":""}${esc(o.tel)}</div></div><span class="tag ${o.status}">${ST[o.status]||esc(o.status)}</span></div>
  <div class="steps"><div class="stp on${en?"":" cur"}"><i>1</i>Pronto</div><div class="stp${en?" on cur":""}"><i>2</i>Em rota</div><div class="stp"><i>3</i>Entregue</div></div>
  <div class="addr"><div class="al">📍 Endereço de entrega</div><div class="at">${esc(o.end)}</div><div class="ab">${esc(bai||"")}${cpl?" · "+esc(cpl):""}</div></div>
  <div class="chips"><span class="chip">💳 ${esc(o.pag)}</span>${o.troco?`<span class="chip w">💵 Troco p/ R$ ${esc(o.troco)}</span>`:""}${o.obs?`<span class="chip w">📝 ${esc(o.obs)}</span>`:""}</div>
  <div class="mlis">${itens}</div>
  <div class="cobrar"><span>Cobrar do cliente</span><b>${BRL(tot)}</b></div>
  <div class="macts"><a class="map" target="_blank" rel="noopener" href="${mapsUrl(o)}">🗺️ Abrir no Maps</a>${tel?`<a href="tel:+55${tel.replace(/^55/,"")}">📞 Ligar</a>`:"<span></span>"}</div>
  ${act}</div>`;
}
function drawMoto(){$("#panel").classList.remove("wide");
  const pr=MORD.filter(o=>o.status==="pronto"),en=MORD.filter(o=>o.status==="entrega");
  $("#panel").innerHTML=`<div class="bar"><div class="bar-top"><div class="brand"><span class="dot">🛵</span><div><div>Lolly Lanches</div><div class="mut" style="font-size:12px;font-weight:500">Área do motoboy</div></div></div><div class="links"><a href="#" onclick="loadMoto(true);return false">↻ Atualizar</a><a href="#" onclick="logout();return false">Sair</a></div></div></div>
  <div class="mhero"><div class="mstat"><i>📦</i><div><b>${pr.length}</b><span>Para sair</span></div></div><div class="mstat b"><i>🛵</i><div><b>${en.length}</b><span>Em rota</span></div></div></div>
  <h2>Prontos para sair <span class="cnt">${pr.length}</span></h2><div class="pgrid">${pr.map(motoCard).join("")||'<div class="empty">Nenhum pedido pronto.<br><span class="mut">Quando o pedido ficar pronto, aparece aqui.</span></div>'}</div>
  <h2>Em entrega <span class="cnt">${en.length}</span></h2><div class="pgrid">${en.map(motoCard).join("")||'<div class="empty">Nenhuma entrega em andamento.</div>'}</div>`;
}
async function motoSaiu(id){
  try{await patchOrder(id,{status:"entrega"})}catch(e){alert("Não foi possível atualizar. Tente de novo.");return}
  await loadMoto(true);
}
async function motoChegou(id){
  const o=MORD.find(x=>x.id===id);if(!o)return;
  const tot=o.total+(Number(o.entrega)||0);
  zapCliente(o,`Olá, ${o.nome}! 🛵\n\nSeu pedido *nº ${o.num}* chegou! Estou na frente do endereço. 😊\n\n💰 Total: ${BRL(tot)}\n💳 Pagamento: ${o.pag}${o.troco?" (troco p/ R$ "+o.troco+")":""}`);
  try{await patchOrder(id,{status:"entregue"})}catch(e){alert("O WhatsApp abriu, mas não foi possível marcar como entregue. Avise o estabelecimento.")}
  await loadMoto(true);
}
function trk(id){let n=0;const t=setInterval(async()=>{n++;const el=$("#trk");if(!cfgOk()||!el||n>200){clearInterval(t);return}try{const r=await api("/rpc/order_status",{method:"POST",body:JSON.stringify({oid:id})});const d=await r.json();if(typeof d==="string"&&ST[d])el.innerHTML="Status: <span class='tag "+d+"'>"+ST[d]+"</span>"}catch(e){}},6000)}
function route(){
  const m=location.hash==="#motoboy",p=location.hash==="#painel"||m;
  $("#app").style.display=p?"none":"block";$("#panel").style.display=p?"block":"none";
  if(m)startMoto();else if(p)startPanel();
}
addEventListener("hashchange",route);
addEventListener("pageshow",e=>{if(e.persisted){const a=$("#anim");if(a)a.classList.remove("on")}});
drawMenu();upd();route();window.CFGP=loadCfg();
</script></body></html>
